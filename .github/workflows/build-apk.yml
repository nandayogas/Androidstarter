name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak project
        run: unzip -q -o launcher-hp.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: launcher-hp
        run: gradle assembleDebug --no-daemon

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-hp-apk
          path: launcher-hp/app/build/outputs/apk/debug/app-debug.apk

      - name: Terbitkan APK di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-terbaru
          name: APK terbaru
          files: launcher-hp/app/build/outputs/apk/debug/app-debug.apk
